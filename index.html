<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Break-Out</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="game-layout">
      <div class="btn container" aria-label="Controles de partida">
        <button class="btn start" type="button">START</button>
        <button class="btn stop" type="button">STOP</button>
      </div>

      <section class="game-area" aria-label="Juego Breakout">
        <canvas aria-label="Tablero del juego Breakout"></canvas>
        <div class="touch-controls" aria-label="Controles táctiles">
          <button class="touch-control left" type="button" aria-label="Mover paleta a la izquierda">&larr;</button>
          <button class="touch-control right" type="button" aria-label="Mover paleta a la derecha">&rarr;</button>
        </div>
      </section>

      <div class="info container">
        <div id="score-title">SCORE:</div>
        <p id="points" aria-live="polite">0</p>
        <p id="status" aria-live="polite">Pulsa START para jugar</p>
      </div>
    </main>
  </body>
  <script src="./script.js"></script>
</html>
